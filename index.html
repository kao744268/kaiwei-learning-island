<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#68cfff"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/game.css"><title>愷威學習島</title></head><body>
<canvas id="fx"></canvas><main>
<section id="home" class="screen active v6home">
  <div class="v6map" aria-label="愷威學習島">
    <img src="./assets/island-map.png" alt="愷威學習島卡通冒險地圖">
    <button class="hotspot hs-color" data-unit="color" aria-label="顏色島"></button>
    <button class="hotspot hs-shape" data-unit="shape" aria-label="形狀森林"></button>
    <button class="hotspot hs-number" data-unit="number" aria-label="數字王國"></button>
    <button class="hotspot hs-bpmf" data-unit="bpmf" aria-label="注音樂園"></button>
    <button class="hotspot hs-daily" data-unit="daily" aria-label="生活小達人"></button>
    <button class="hotspot hs-body" data-unit="body" aria-label="身體探險隊"></button>
    <button class="hotspot hs-trace" data-unit="trace" aria-label="筆畫練習屋"></button>
  </div>
  <div class="v6help">點地圖上的區域開始冒險</div>
</section>
<section id="game" class="screen"><div class="gameShell"><header><button id="back" class="round">🏠</button><div id="title"></div><div id="progress"></div><div class="tools"><button id="replay">🔊<small>重聽</small></button><button id="hint">💡<small>提示</small></button><button id="restart">↻<small>重來</small></button></div></header><div class="guideRow"><div class="guideMascot">🐶</div><div id="caption"></div><div id="mode"></div></div><div id="stars"></div><div id="field"></div><div id="feedback"></div></div></section>
</main><div id="traceSelect"><div class="traceSelectCard"><span>✍️</span><h2>今天想寫什麼？</h2><button id="traceNumber">🔢<b>寫數字</b><small>1 ～ 20</small></button><button id="traceBpmf">ㄅ<b>寫注音</b><small>ㄅ ～ ㄦ</small></button><button id="traceCancel">回學習島</button></div></div><div id="finish"><div><span>🏆🌟</span><h2>太棒了！</h2><p>這一關完成囉！</p><button id="again">再玩一次</button><button id="homeBtn">回學習島</button></div></div>
<script src="games/content.js"></script><script src="js/game-engine.js"></script><script src="js/app.js"></script></body></html>
